# Deploys the static site to our own server over SSH (rsync)
name: Deploy to server

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; don't cancel a deploy that is already running
concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://corvexo-games.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload site
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          rsync -rlvz --delete --chmod=D755,F644 \
            --exclude='.git*' --exclude='.github' --exclude='deploy' --exclude='.DS_Store' \
            -e "ssh -p $SSH_PORT" \
            ./ "deploy@$SSH_HOST:/var/www/corvexo/"

      - name: Check site is up
        run: curl -fsS -o /dev/null -w '%{http_code}\n' https://corvexo-games.com/
