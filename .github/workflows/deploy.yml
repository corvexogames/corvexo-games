name: Deploy Website

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Сначала загружаем ваш приватный ключ в SSH-агент GitHub Actions
      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Пароль админки статистики (/admin/) хранится в секрете ADMIN_PASSWORD, на сервер уходит только его хеш
      - name: Write admin config
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          php -r '$p = getenv("ADMIN_PASSWORD"); echo "<?php\nreturn [\"admin_hash\" => " . var_export($p === "" ? "" : password_hash($p, PASSWORD_DEFAULT), true) . "];\n";' > api/config.php

      # 2. Затем выполняем деплой через rsync (теперь он автоматически подхватит ключ)
      - name: Upload site
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -rlvz --delete --chmod=D755,F644 \
            --exclude='.git*' --exclude='.github' --exclude='deploy' --exclude='.DS_Store' \
            -e "ssh -p $SSH_PORT -o StrictHostKeyChecking=no" \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"